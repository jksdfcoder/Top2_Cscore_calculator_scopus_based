server {
  listen 8080;
  root /usr/share/nginx/html;
  access_log off;
  server_tokens off;

  # connect-src 'self' is the privacy boundary: user data cannot be sent off-origin.
  # ponytail: Nuxt inlines a per-build config script, so script-src keeps 'unsafe-inline'; switch to hashes if the build emits them.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;

  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
}
